name: Research collection observation

on:
  workflow_dispatch:
    inputs:
      observation_seconds:
        description: "실제 production traffic 관찰 시간(60~1800초)"
        required: true
        default: "360"

permissions:
  contents: read

concurrency:
  group: deploy-aibot-production
  cancel-in-progress: false

jobs:
  observe:
    name: Observe production Research collection
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35

    steps:
      - name: Observe bounded production traffic
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_SHA: ${{ github.sha }}
          OBSERVATION_SECONDS: ${{ inputs.observation_seconds }}
          RUN_ID: ${{ github.run_id }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: deploy
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          timeout: 30s
          command_timeout: 32m
          envs: EXPECTED_SHA,OBSERVATION_SECONDS,RUN_ID
          script: |
            set -Eeuo pipefail

            if [[ ! "$OBSERVATION_SECONDS" =~ ^[0-9]+$ ]] \
              || (( OBSERVATION_SECONDS < 60 || OBSERVATION_SECONDS > 1800 )); then
              echo "ERROR: observation_seconds must be between 60 and 1800" >&2
              exit 1
            fi

            cd /var/www/aibot
            test -x ./venv/bin/python
            test -f .deployed-sha
            deployed_sha="$(tr -d '[:space:]' < .deployed-sha)"
            if [[ "$deployed_sha" != "$EXPECTED_SHA" ]]; then
              echo "ERROR: production SHA does not match workflow main SHA" >&2
              exit 1
            fi
            echo "PRODUCTION_SHA=$deployed_sha"

            baseline="/tmp/aibot-rpc-baseline-${RUN_ID}.json"
            pm2_before="/tmp/aibot-pm2-before-${RUN_ID}.json"
            pm2_after="/tmp/aibot-pm2-after-${RUN_ID}.json"
            trap 'rm -f "$baseline" "$pm2_before" "$pm2_after"' EXIT

            export PM2_HOME=/home/deploy/.pm2
            pm2 jlist > "$pm2_before"
            ./venv/bin/python -m src.research.collection_stability \
              --write-baseline "$baseline"
            since_epoch="$(date +%s)"

            echo "RESEARCH_OBSERVATION seconds=$OBSERVATION_SECONDS"
            sleep "$OBSERVATION_SECONDS"

            ./venv/bin/python -m src.research.alpha_discovery
            ./venv/bin/python - <<'PY'
            import json
            from pathlib import Path

            from src.research_archive import archive_integrity_metrics

            report = json.loads(
                Path("data/alpha_discovery.json").read_text(encoding="utf-8")
            )
            observations = json.loads(
                Path("data/signal_observations.json").read_text(encoding="utf-8")
            ).get("observations", [])
            source = report["input_summary"]
            smart_sources = source.get("smart_money_discovery_source_counts", {})
            print(
                "ALPHA_COHORT "
                f"source={source['source_type']} "
                f"source_rows={source['source_row_count']} "
                f"cohort={source['cohort']} "
                f"cohort_rows={source['cohort_row_count']}"
            )
            print(
                "ALPHA_SMART_MONEY_SOURCES "
                f"helius_transaction_subscribe={smart_sources.get('helius_transaction_subscribe', 0)} "
                f"solana_logs_subscribe={smart_sources.get('solana_logs_subscribe', 0)} "
                f"unknown_legacy={smart_sources.get('unknown_legacy', 0)}"
            )
            for family in ("SMART_MONEY", "MOMENTUM"):
                summary = report["families"][family]["summary"]
                event = summary["event_primary_outcome"]
                unique = summary["unique_mint_primary_outcome"]
                split = summary["unique_mint_split"]
                print(
                    "ALPHA_COHORT_FAMILY "
                    f"family={family} events={summary['event_signal_count']} "
                    f"unique_mints={summary['unique_mint_count']} "
                    f"train={split['train_count']} holdout={split['holdout_count']} "
                    f"event_trackable={event['trackable_count']} "
                    f"event_sampled={event['sampled_count']} "
                    f"event_missing={event['missing_count']} "
                    f"event_missing_reasons={json.dumps(event['missing_reasons'], sort_keys=True)} "
                    f"event_raw_coverage={event['raw_coverage_rate_percent']} "
                    f"event_trackable_coverage={event['trackable_coverage_rate_percent']} "
                    f"unique_trackable={unique['trackable_count']} "
                    f"unique_sampled={unique['sampled_count']} "
                    f"unique_missing={unique['missing_count']} "
                    f"unique_missing_reasons={json.dumps(unique['missing_reasons'], sort_keys=True)}"
                )
            archive = archive_integrity_metrics(operational_rows=observations)
            print(
                "ARCHIVE_INTEGRITY "
                f"total={archive['archive_total_rows']} "
                f"research_v1={archive['research_v1_rows']} "
                f"recent={archive['archived_recent_interval']} "
                f"research_recent={archive['research_v1_signals_recent_interval']} "
                f"duplicates={archive['duplicate_prevented_count']} "
                f"write_failures={archive['archive_write_failure_count']} "
                f"unarchived={archive['unarchived_completed_rows_count']} "
                f"bytes={archive['archive_total_bytes']} "
                f"average_row_bytes={archive['average_archive_row_bytes']}"
            )
            PY
            echo "RESEARCH_REPORT_SCOPE=cumulative"
            ./venv/bin/python -m src.research.collection_stability
            echo "RESEARCH_REPORT_SCOPE=observation_window"
            ./venv/bin/python -m src.research.collection_stability \
              --since-epoch "$since_epoch" \
              --baseline "$baseline"

            pm2 jlist > "$pm2_after"
            pm2_health_status=0
            ./venv/bin/python - "$pm2_before" "$pm2_after" <<'PY' || pm2_health_status=$?
            import json
            import sys
            from pathlib import Path

            def selected(path):
                apps = json.loads(Path(path).read_text(encoding="utf-8"))
                return {
                    app.get("name"): {
                        "status": (app.get("pm2_env") or {}).get("status"),
                        "pid": app.get("pid"),
                        "restarts": int(
                            (app.get("pm2_env") or {}).get("restart_time", 0) or 0
                        ),
                    }
                    for app in apps
                    if app.get("name") in {
                        "aibot-monitor",
                        "aibot-risk-manager",
                        "aibot-dashboard",
                        "wallet_feeder",
                    }
                }

            before = selected(sys.argv[1])
            after = selected(sys.argv[2])
            failures = []
            for name in (
                "aibot-monitor", "aibot-risk-manager", "aibot-dashboard"
            ):
                current = after.get(name, {})
                if current.get("status") != "online" or not current.get("pid"):
                    failures.append(f"PM2 process unhealthy: {name}")
                if current.get("restarts") != before.get(name, {}).get("restarts"):
                    failures.append(
                        f"PM2 restart increased during observation: {name}"
                    )
            for name, state in sorted(after.items()):
                print(
                    f"PM2_OBSERVATION name={name} status={state['status']} "
                    f"pid={state['pid']} restarts={state['restarts']}"
                )
            if failures:
                raise SystemExit("; ".join(failures))
            PY
            if (( pm2_health_status != 0 )); then
              ./venv/bin/python -m src.research.restart_forensics \
                --before "$pm2_before" \
                --after "$pm2_after" \
                --deployed-sha "$deployed_sha" \
                --since-epoch "$since_epoch" || true
              exit "$pm2_health_status"
            fi

            dashboard_status="$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' http://127.0.0.1:8501/ai-bot/)"
            test "$dashboard_status" = "200"
            echo "DASHBOARD_HTTP=$dashboard_status"
