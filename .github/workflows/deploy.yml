name: Deploy aibot

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-aibot-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Ubuntu
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    steps:
      - name: Check out main
        uses: actions/checkout@v4

      # No fingerprint input is supplied: appleboy connects without pinning the
      # server host key, as required for this password-only deployment.
      - name: Back up ledgers and prepare deploy ownership
        uses: appleboy/ssh-action@v1
        env:
          SUDO_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: deploy
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          timeout: 30s
          command_timeout: 2m
          envs: SUDO_PASSWORD,DEPLOY_SHA
          script: |
            set -Eeuo pipefail

            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' true

            if sudo test -d /root/.pm2; then
              sudo env PM2_HOME=/root/.pm2 pm2 delete \
                aibot-monitor aibot-risk-manager aibot-dashboard wallet_feeder || true
              sudo env PM2_HOME=/root/.pm2 pm2 save --force || true
            fi

            sudo mkdir -p /var/www/aibot
            sudo chown -R deploy:deploy /var/www/aibot
            test -w /var/www/aibot

            backup_root="/home/deploy/aibot-backups"
            backup_dir="$backup_root/predeploy-$(date -u +%Y%m%dT%H%M%SZ)-${DEPLOY_SHA:0:12}"
            mkdir -p "$backup_dir"
            cd /var/www/aibot

            python3 - "$backup_dir" "$DEPLOY_SHA" <<'PY'
            import fcntl
            import hashlib
            import json
            import os
            import sys
            from datetime import datetime, timezone
            from pathlib import Path

            root = Path("/var/www/aibot/data")
            target = Path(sys.argv[1])
            deploy_sha = sys.argv[2]
            names = (
                "signal_observations.json",
                "shadow_trades.json",
                "paper_trades.json",
                "wallet_performance.json",
                "global_metrics.json",
                "research_archive_metrics.json",
            )

            def sized(value):
                return len(value) if isinstance(value, (dict, list)) else 0

            def summarize(name, document):
                if name == "signal_observations.json":
                    rows = document.get("observations")
                    if not isinstance(rows, list):
                        raise RuntimeError("observation rows are malformed")
                    identity = ""
                    if rows and isinstance(rows[-1], dict):
                        identity = str(
                            rows[-1].get("observation_id")
                            or rows[-1].get("id")
                            or ""
                        )
                    return {
                        "schema_version": document.get("schema_version"),
                        "version": document.get("version"),
                        "observation_count": len(rows),
                        "latest_observation_id_sha256": (
                            hashlib.sha256(identity.encode()).hexdigest()
                            if identity else None
                        ),
                    }
                if name == "shadow_trades.json":
                    return {"trade_count": sized(document.get("trades"))}
                if name == "paper_trades.json":
                    return {
                        "position_count": sized(document.get("positions")),
                        "event_count": sized(document.get("events")),
                    }
                if name == "global_metrics.json":
                    metrics = document.get("metrics")
                    if not isinstance(metrics, dict):
                        raise RuntimeError("global metrics are malformed")
                    return {
                        "metric_count": len(metrics),
                        "observer_state": metrics.get("observer_state"),
                        "pending_research_observations": metrics.get(
                            "pending_research_observations"
                        ),
                    }
                if name == "research_archive_metrics.json":
                    return {
                        "duplicate_prevented_count": document.get(
                            "duplicate_prevented_count"
                        ),
                        "archive_write_failure_count": document.get(
                            "archive_write_failure_count"
                        ),
                        "last_archive_success": document.get(
                            "last_archive_success"
                        ),
                    }
                return {"wallet_count": sized(document.get("wallets"))}

            manifest = {
                "deploy_sha": deploy_sha,
                "created_at": datetime.now(timezone.utc).isoformat(),
                "created_at_epoch": datetime.now(timezone.utc).timestamp(),
                "files": {},
            }
            for name in names:
                source = root / name
                lock_path = source.with_name(f"{source.name}.lock")
                lock_path.parent.mkdir(parents=True, exist_ok=True)
                with lock_path.open("a+b") as lock:
                    fcntl.flock(lock.fileno(), fcntl.LOCK_EX)
                    try:
                        if not source.exists():
                            manifest["files"][name] = {"exists": False}
                            print(f"BACKUP_FILE name={name} exists=false")
                            continue
                        payload = source.read_bytes()
                        document = json.loads(payload.decode("utf-8"))
                        if not isinstance(document, dict):
                            raise RuntimeError(f"{name} is not a JSON object")
                        destination = target / name
                        with destination.open("xb") as output:
                            output.write(payload)
                            output.flush()
                            os.fsync(output.fileno())
                    finally:
                        fcntl.flock(lock.fileno(), fcntl.LOCK_UN)
                summary = summarize(name, document)
                manifest["files"][name] = {
                    "exists": True,
                    "sha256": hashlib.sha256(payload).hexdigest(),
                    "size_bytes": len(payload),
                    "summary": summary,
                }
                print(
                    f"BACKUP_FILE name={name} exists=true summary={summary}"
                )

            archive_source = root / "research_archive" / "records"
            archive_target = target / "research_archive" / "records"
            archive_files = sorted(archive_source.glob("*/*.json"))
            archive_digest = hashlib.sha256()
            archive_bytes = 0
            for source in archive_files:
                relative = source.relative_to(archive_source)
                payload = source.read_bytes()
                destination = archive_target / relative
                destination.parent.mkdir(parents=True, exist_ok=True)
                with destination.open("xb") as output:
                    output.write(payload)
                    output.flush()
                    os.fsync(output.fileno())
                digest = hashlib.sha256(payload).hexdigest()
                archive_digest.update(str(relative).encode("utf-8"))
                archive_digest.update(digest.encode("ascii"))
                archive_bytes += len(payload)
            manifest["research_archive"] = {
                "record_count": len(archive_files),
                "size_bytes": archive_bytes,
                "tree_sha256": archive_digest.hexdigest(),
            }
            print(
                "BACKUP_RESEARCH_ARCHIVE "
                f"records={len(archive_files)} size_bytes={archive_bytes} "
                f"tree_sha256={archive_digest.hexdigest()}"
            )

            provider_state_root = root / "solana_rpc_providers"
            manifest["rpc_provider_states"] = {}
            for provider in (
                "alchemy", "chainstack", "ankr", "helius", "solana_public"
            ):
                state_path = provider_state_root / f"{provider}.json"
                if not state_path.exists():
                    continue
                state = json.loads(state_path.read_text(encoding="utf-8"))
                if not isinstance(state, dict):
                    raise RuntimeError(f"RPC provider state malformed: {provider}")
                manifest["rpc_provider_states"][provider] = {
                    key: state.get(key)
                    for key in (
                        "request_count", "success_count", "failure_count",
                        "rate_limit_count", "circuit_open_count", "circuit_state",
                    )
                }

            manifest_path = target / "manifest.json"
            temporary = target / "manifest.json.tmp"
            with temporary.open("x", encoding="utf-8") as output:
                json.dump(manifest, output, ensure_ascii=False, indent=2)
                output.write("\n")
                output.flush()
                os.fsync(output.fileno())
            os.replace(temporary, manifest_path)
            print(f"BACKUP_MANIFEST={manifest_path}")
            PY

            printf '%s\n' "$backup_dir" > "$backup_root/latest-${DEPLOY_SHA}.txt"

      - name: Upload application source
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: deploy
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          timeout: 30s
          command_timeout: 5m
          source: "src,requirements.txt,ecosystem.config.js,scripts"
          target: "/var/www/aibot"
          overwrite: true
          rm: false

      - name: Install, validate, and reload PM2 services
        uses: appleboy/ssh-action@v1
        env:
          SUDO_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: deploy
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          timeout: 30s
          command_timeout: 10m
          envs: SUDO_PASSWORD,DEPLOY_SHA
          script: |
            set -Eeuo pipefail

            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' true
            sudo chown -R deploy:deploy /var/www/aibot

            cd /var/www/aibot

            mkdir -p data logs

            if [[ ! -x ./venv/bin/python ]]; then
              echo "Existing venv not found; creating /var/www/aibot/venv"
              python3 -m venv venv
            fi

            if [[ ! -f ./.env ]]; then
              echo "ERROR: /var/www/aibot/.env is missing; deployment cannot start safely." >&2
              exit 1
            fi

            PIP_NO_CACHE_DIR=1 ./venv/bin/python -m pip install \
              --disable-pip-version-check \
              --only-binary=:all: \
              -r requirements.txt

            ./venv/bin/python -m compileall -q src
            ./venv/bin/python -c \
              "import fcntl; from src.state_store import exclusive_file_lock; print('fcntl/state_store: OK')"

            export PM2_HOME=/home/deploy/.pm2
            pm2 startOrReload ecosystem.config.js --update-env

            pm2 describe aibot-monitor >/dev/null
            pm2 describe aibot-risk-manager >/dev/null
            pm2 describe aibot-dashboard >/dev/null
            pm2 describe wallet_feeder >/dev/null

            ownership_mismatch="$(find /var/www/aibot -xdev \
              \( ! -user deploy -o ! -group deploy \) -print -quit)"
            if [[ -n "$ownership_mismatch" ]]; then
              echo "ERROR: ownership mismatch remains at $ownership_mismatch" >&2
              exit 1
            fi

            sleep 20
            ./venv/bin/python - /tmp/aibot-pm2-before.json <<'PY'
            import json
            import subprocess
            import sys
            from pathlib import Path

            apps = json.loads(subprocess.check_output(["pm2", "jlist"]))
            selected = {}
            for app in apps:
                name = app.get("name")
                if name in {
                    "aibot-monitor",
                    "aibot-risk-manager",
                    "aibot-dashboard",
                    "wallet_feeder",
                }:
                    env = app.get("pm2_env", {})
                    selected[name] = {
                        "status": env.get("status"),
                        "pid": app.get("pid"),
                        "restart_time": env.get("restart_time", 0),
                    }
            Path(sys.argv[1]).write_text(json.dumps(selected), encoding="utf-8")
            PY

            sleep 10
            ./venv/bin/python - /tmp/aibot-pm2-after.json <<'PY'
            import json
            import subprocess
            import sys
            from pathlib import Path

            apps = json.loads(subprocess.check_output(["pm2", "jlist"]))
            selected = {}
            for app in apps:
                name = app.get("name")
                if name in {
                    "aibot-monitor",
                    "aibot-risk-manager",
                    "aibot-dashboard",
                    "wallet_feeder",
                }:
                    env = app.get("pm2_env", {})
                    selected[name] = {
                        "status": env.get("status"),
                        "pid": app.get("pid"),
                        "restart_time": env.get("restart_time", 0),
                    }
            Path(sys.argv[1]).write_text(json.dumps(selected), encoding="utf-8")
            PY

            ./venv/bin/python - <<'PY'
            import json
            from pathlib import Path

            before = json.loads(
                Path("/tmp/aibot-pm2-before.json").read_text(encoding="utf-8")
            )
            after = json.loads(
                Path("/tmp/aibot-pm2-after.json").read_text(encoding="utf-8")
            )
            core = (
                "aibot-monitor",
                "aibot-risk-manager",
                "aibot-dashboard",
            )
            for name in core:
                if name not in before or name not in after:
                    raise SystemExit(f"PM2 process missing: {name}")
                if after[name]["status"] != "online" or not after[name]["pid"]:
                    raise SystemExit(f"PM2 process unhealthy: {name}")
                if after[name]["restart_time"] != before[name]["restart_time"]:
                    raise SystemExit(f"PM2 restart loop detected: {name}")
                print(
                    "PM2_HEALTH "
                    f"name={name} status=online pid={after[name]['pid']} "
                    f"restarts={after[name]['restart_time']}"
                )
            feeder = after.get("wallet_feeder", {})
            if feeder.get("status") not in {"online", "stopped"}:
                raise SystemExit("wallet_feeder PM2 entry is unhealthy")
            print(
                "PM2_FEEDER "
                f"status={feeder.get('status')} pid={feeder.get('pid')} "
                f"restarts={feeder.get('restart_time')}"
            )
            PY
            rm -f /tmp/aibot-pm2-before.json /tmp/aibot-pm2-after.json

            verification_failed=0
            for app in aibot-monitor aibot-risk-manager aibot-dashboard; do
              pid="$(pm2 pid "$app")"
              owner="$(ps -o user= -p "$pid" 2>/dev/null | xargs || true)"
              if [[ -z "$pid" || "$pid" == "0" || "$owner" != "deploy" ]]; then
                echo "ERROR: $app failed verification (pid=$pid owner=$owner)" >&2
                pm2 logs "$app" --lines 30 --nostream || true
                verification_failed=1
              fi
            done

            test "$verification_failed" -eq 0

            ./venv/bin/python - "$DEPLOY_SHA" <<'PY'
            import hashlib
            import json
            import time
            import sys
            from pathlib import Path

            deploy_sha = sys.argv[1]
            backup_root = Path("/home/deploy/aibot-backups")
            marker = backup_root / f"latest-{deploy_sha}.txt"
            backup_dir = Path(marker.read_text(encoding="utf-8").strip())
            manifest = json.loads(
                (backup_dir / "manifest.json").read_text(encoding="utf-8")
            )
            if manifest.get("deploy_sha") != deploy_sha:
                raise SystemExit("backup manifest deploy SHA mismatch")
            for name, item in manifest["files"].items():
                if not item.get("exists"):
                    continue
                payload = (backup_dir / name).read_bytes()
                if hashlib.sha256(payload).hexdigest() != item["sha256"]:
                    raise SystemExit(f"backup checksum mismatch: {name}")
            archive_digest = hashlib.sha256()
            archive_files = sorted(
                (backup_dir / "research_archive" / "records").glob("*/*.json")
            )
            archive_bytes = 0
            for path in archive_files:
                payload = path.read_bytes()
                relative = path.relative_to(
                    backup_dir / "research_archive" / "records"
                )
                archive_digest.update(str(relative).encode("utf-8"))
                archive_digest.update(hashlib.sha256(payload).hexdigest().encode("ascii"))
                archive_bytes += len(payload)
            archive_manifest = manifest.get("research_archive", {})
            if (
                len(archive_files) != archive_manifest.get("record_count")
                or archive_bytes != archive_manifest.get("size_bytes")
                or archive_digest.hexdigest() != archive_manifest.get("tree_sha256")
            ):
                raise SystemExit("research archive backup checksum mismatch")

            data = Path("data")
            current = {}
            for name in (
                "signal_observations.json",
                "shadow_trades.json",
                "paper_trades.json",
                "wallet_performance.json",
            ):
                document = json.loads((data / name).read_text(encoding="utf-8"))
                if not isinstance(document, dict):
                    raise SystemExit(f"production ledger malformed: {name}")
                current[name] = document

            observations = current["signal_observations.json"]
            if observations.get("schema_version") != 5:
                raise SystemExit("signal observation schema v5 migration failed")
            rows = observations.get("observations")
            if not isinstance(rows, list):
                raise SystemExit("signal observation rows are malformed")
            before_observation = manifest["files"][
                "signal_observations.json"
            ]
            previous_count = (
                before_observation.get("summary", {}).get("observation_count", 0)
                if before_observation.get("exists") else 0
            )
            if len(rows) < previous_count:
                raise SystemExit("signal observation count decreased during deploy")

            metrics_document = json.loads(
                (data / "global_metrics.json").read_text(encoding="utf-8")
            )
            metrics = metrics_document.get("metrics", {})
            heartbeat = metrics.get("observer_heartbeat_at")
            if metrics.get("observer_state") != "RUNNING":
                raise SystemExit(
                    f"observer is not running: {metrics.get('observer_state')}"
                )
            if not isinstance(heartbeat, (int, float)) or time.time() - heartbeat > 90:
                raise SystemExit("observer heartbeat is missing or stale")

            latest_identity = ""
            if rows and isinstance(rows[-1], dict):
                latest_identity = str(
                    rows[-1].get("observation_id")
                    or rows[-1].get("id")
                    or ""
                )
            latest_hash = (
                hashlib.sha256(latest_identity.encode()).hexdigest()
                if latest_identity else None
            )
            previous_hash = before_observation.get("summary", {}).get(
                "latest_observation_id_sha256"
            )
            shadow_count = len(current["shadow_trades.json"].get("trades", []))
            positions = current["paper_trades.json"].get("positions", {})
            wallets = current["wallet_performance.json"].get("wallets", {})
            print(
                "OBSERVER_HEALTH "
                f"state=RUNNING heartbeat_age_seconds={time.time() - heartbeat:.1f} "
                f"pending={metrics.get('pending_research_observations')} "
                f"last_success={metrics.get('last_successful_horizon_sample_at')} "
                f"horizon_missed={metrics.get('horizon_missed_count')}"
            )
            print(
                "LEDGER_HEALTH schema=5 "
                f"observations_before={previous_count} observations_after={len(rows)} "
                f"latest_id_changed={latest_hash != previous_hash} "
                f"shadow_trades={shadow_count} positions={len(positions)} "
                f"wallets={len(wallets)} backup={backup_dir}"
            )
            PY

            ./venv/bin/python - <<'PY'
            import asyncio

            import aiohttp

            from src.solana_rpc import (
                canonical_rpc_failure_reason,
                provider_configs_from_env,
                provider_state,
                solana_rpc_call,
            )

            async def main():
                providers = provider_configs_from_env()
                names = ",".join(provider.name for provider in providers)
                print(f"RPC_ACTIVE_PROVIDERS names={names or 'NONE'}")
                timeout = aiohttp.ClientTimeout(total=10)
                async with aiohttp.ClientSession(timeout=timeout) as session:
                    for provider in providers:
                        outcome = "SUCCESS"
                        reason = "NONE"
                        try:
                            await solana_rpc_call(
                                session,
                                "getHealth",
                                [],
                                workload="deployment_smoke",
                                providers=[provider],
                                provider_local_attempts=1,
                                overall_attempt_budget=1,
                            )
                        except Exception as exc:
                            outcome = "FAILURE"
                            reason = (
                                canonical_rpc_failure_reason(exc)
                                or type(exc).__name__
                            )
                        state = provider_state(provider.name, providers)
                        print(
                            "RPC_PROVIDER_SMOKE "
                            f"provider={provider.name} enabled={state['enabled']} "
                            f"outcome={outcome} reason={reason} "
                            f"requests={state['request_count']} "
                            f"successes={state['success_count']} "
                            f"failures={state['failure_count']} "
                            f"rate_limits={state['rate_limit_count']} "
                            f"success_rate={state['success_rate_percent']} "
                            f"consecutive_failures={state['consecutive_failures']} "
                            f"circuit_opens={state['circuit_open_count']} "
                            f"circuit={state['circuit_state']} "
                            f"last_success={state['last_success_at_epoch']} "
                            f"last_failure={state['last_failure_at_epoch']} "
                            f"last_failure_category={state['last_failure_category']}"
                        )

                    before = {
                        provider.name: int(
                            provider_state(provider.name, providers).get(
                                "success_count", 0
                            ) or 0
                        )
                        for provider in providers
                    }
                    result = "SUCCESS"
                    reason = "NONE"
                    try:
                        await solana_rpc_call(
                            session,
                            "getHealth",
                            [],
                            workload="deployment_smoke",
                            providers=providers,
                        )
                    except Exception as exc:
                        result = "FAILURE"
                        reason = (
                            canonical_rpc_failure_reason(exc)
                            or type(exc).__name__
                        )
                    winners = [
                        provider.name
                        for provider in providers
                        if int(
                            provider_state(provider.name, providers).get(
                                "success_count", 0
                            ) or 0
                        ) > before[provider.name]
                    ]
                    print(
                        "RPC_ROUTER_SMOKE "
                        f"outcome={result} reason={reason} "
                        f"successful_provider={','.join(winners) or 'NONE'}"
                    )

            asyncio.run(main())
            PY

            ./venv/bin/python -m src.research.alpha_discovery
            ./venv/bin/python - <<'PY'
            import json
            from pathlib import Path

            report = json.loads(
                Path("data/alpha_discovery.json").read_text(encoding="utf-8")
            )
            if report.get("automatic_trading_changes") is not False:
                raise SystemExit("Alpha report trading-change guard failed")
            source = report.get("input_summary", {})
            if source.get("source_type") != "research_archive":
                raise SystemExit("Alpha report is not using Research archive")
            if source.get("cohort") != "research_v1_60m":
                raise SystemExit("Alpha report cohort isolation failed")
            print(
                "ALPHA_SOURCE "
                f"type={source.get('source_type')} "
                f"path={source.get('source_path')} "
                f"archive_rows={source.get('source_row_count')} "
                f"cohort={source.get('cohort')} "
                f"cohort_rows={source.get('cohort_row_count')}"
            )
            for family in ("SMART_MONEY", "MOMENTUM"):
                summary = report["families"][family]["summary"]
                primary = summary["event_primary_outcome"]
                print(
                    "ALPHA_FAMILY "
                    f"name={family} signals={summary['event_signal_count']} "
                    f"unique_mints={summary['unique_mint_count']} "
                    f"trackable_60m={primary['trackable_count']} "
                    f"sampled_60m={primary['sampled_count']}"
                )
            counts = report["candidate_counts"]
            print(
                "ALPHA_CANDIDATES "
                f"promising={counts['PROMISING']} "
                f"unstable={counts['UNSTABLE']} "
                f"insufficient={counts['INSUFFICIENT_DATA']}"
            )
            PY

            # 일반 배포는 실제 signal을 기다리지 않고 구조 상태만 즉시 확인한다.
            ./venv/bin/python -m src.research.collection_stability
            ./venv/bin/python - "$DEPLOY_SHA" <<'PY'
            import json
            import subprocess
            import sys
            import time
            from collections import Counter
            from pathlib import Path

            from src.research_archive import archive_integrity_metrics
            from src.solana_rpc import provider_configs_from_env, provider_state

            deploy_sha = sys.argv[1]
            backup_root = Path("/home/deploy/aibot-backups")
            marker = backup_root / f"latest-{deploy_sha}.txt"
            backup_dir = Path(marker.read_text(encoding="utf-8").strip())
            manifest = json.loads(
                (backup_dir / "manifest.json").read_text(encoding="utf-8")
            )
            since_epoch = float(manifest["created_at_epoch"])
            observations = json.loads(
                Path("data/signal_observations.json").read_text(encoding="utf-8")
            )
            rows = observations.get("observations")
            if not isinstance(rows, list):
                raise SystemExit("signal observation rows are malformed")
            archive = archive_integrity_metrics(operational_rows=rows)
            print(
                "RESEARCH_ARCHIVE "
                f"total={archive['archive_total_rows']} "
                f"research_v1={archive['cohort_row_count']} "
                f"recent={archive['archived_recent_interval']} "
                f"research_recent={archive['research_v1_signals_recent_interval']} "
                f"duplicates={archive['duplicate_prevented_count']} "
                f"write_failures={archive['archive_write_failure_count']} "
                f"unarchived={archive['unarchived_completed_rows_count']} "
                f"bytes={archive['archive_total_bytes']} "
                f"average_row_bytes={archive['average_archive_row_bytes']} "
                f"last_success={archive['last_archive_success']} "
                f"last_failure={archive['last_archive_failure']}"
            )
            if archive["unarchived_completed_rows_count"]:
                raise SystemExit("completed Research rows remain unarchived")
            new_rows = [
                row for row in rows
                if isinstance(row, dict)
                and float(row.get("started_at_epoch", 0) or 0) >= since_epoch
            ]

            def reasons(row):
                values = row.get("decision_reasons")
                return {
                    str(value).upper()
                    for value in values if isinstance(value, str)
                } if isinstance(values, list) else set()

            analyzer_success = sum(
                1 for row in new_rows
                if row.get("analysis_completed_at")
                and str(row.get("decision_status") or "").upper()
                != "DISCOVERED"
            )
            all_exhausted = sum(
                "RPC_ALL_PROVIDERS_EXHAUSTED" in reasons(row)
                for row in new_rows
            )
            processing_failed = sum(
                str(row.get("quote_status") or "").upper()
                == "PROCESSING_FAILED"
                for row in new_rows
            )
            executable = sum(
                str(row.get("quote_status") or "").upper() == "EXECUTABLE"
                for row in new_rows
            )
            pending_trackable = sum(
                str(row.get("quote_status") or "").upper() == "EXECUTABLE"
                and str(row.get("status") or "").upper() == "PENDING"
                and row.get("tracking_profile") == "research_v1_60m"
                for row in new_rows
            )
            sample_counts = Counter(
                str(sample.get("interval"))
                for row in new_rows
                for sample in (
                    row.get("samples") if isinstance(row.get("samples"), list)
                    else []
                )
                if isinstance(sample, dict)
            )
            print(
                "RESEARCH_FUNNEL "
                f"signals={len(new_rows)} analyzer_success={analyzer_success} "
                f"rpc_all_providers_exhausted={all_exhausted} "
                f"processing_failed={processing_failed} "
                f"executable={executable} "
                f"pending_trackable={pending_trackable}"
            )
            print(
                "RESEARCH_HORIZONS "
                f"sample_1m={sample_counts['1m']} "
                f"sample_3m={sample_counts['3m']} "
                f"sample_5m={sample_counts['5m']} "
                f"first_executable_pending={pending_trackable > 0}"
            )

            stranded = [
                row for row in rows
                if isinstance(row, dict)
                and str(row.get("status") or "").upper() == "DISCOVERED"
                and str(row.get("decision_status") or "").upper() == "DISCOVERED"
                and str(row.get("quote_status") or "").upper() == "NOT_REQUESTED"
            ]
            ages = [
                max(0.0, time.time() - float(row.get("started_at_epoch", 0) or 0))
                for row in stranded
                if float(row.get("started_at_epoch", 0) or 0) > 0
            ]
            print(
                "STRANDED_DISCOVERED "
                f"count={len(stranded)} "
                f"missing_analysis_completed={sum(not row.get('analysis_completed_at') for row in stranded)} "
                f"empty_decision_reasons={sum(not row.get('decision_reasons') for row in stranded)} "
                f"oldest_age_seconds={max(ages) if ages else None} "
                f"newest_age_seconds={min(ages) if ages else None}"
            )

            providers = provider_configs_from_env()
            baseline_states = manifest.get("rpc_provider_states", {})
            for provider in providers:
                state = provider_state(provider.name, providers)
                baseline = baseline_states.get(provider.name, {})
                print(
                    "RPC_PROVIDER_DELTA "
                    f"provider={provider.name} enabled={state['enabled']} "
                    f"requests={state['request_count']} "
                    f"successes={state['success_count']} "
                    f"failures={state['failure_count']} "
                    f"rate_limits={state['rate_limit_count']} "
                    f"request_delta={int(state['request_count']) - int(baseline.get('request_count', 0) or 0)} "
                    f"success_delta={int(state['success_count']) - int(baseline.get('success_count', 0) or 0)} "
                    f"failure_delta={int(state['failure_count']) - int(baseline.get('failure_count', 0) or 0)} "
                    f"rate_limit_delta={int(state['rate_limit_count']) - int(baseline.get('rate_limit_count', 0) or 0)} "
                    f"circuit={state['circuit_state']} "
                    f"last_success={state['last_success_at_epoch']}"
                )

            metrics_document = json.loads(
                Path("data/global_metrics.json").read_text(encoding="utf-8")
            )
            metrics = metrics_document.get("metrics", {})
            ws_heartbeat = metrics.get("monitor_process_heartbeat_at")
            print(
                "COLLECTION_HEALTH "
                f"wallet_ws_state={metrics.get('wallet_ws_state')} "
                f"monitor_heartbeat_age_seconds="
                f"{time.time() - ws_heartbeat if isinstance(ws_heartbeat, (int, float)) else None} "
                f"observer_state={metrics.get('observer_state')}"
            )

            alpha = json.loads(
                Path("data/alpha_discovery.json").read_text(encoding="utf-8")
            )
            candidate_fields = {
                "family", "analysis_type", "labels", "status",
                "sampled_count", "trackable_coverage_rate_percent",
                "train_expectancy_percent", "holdout_expectancy_percent",
                "train_profit_factor", "holdout_profit_factor",
                "holdout_expectancy_retention_ratio",
            }
            top_candidates = alpha.get("top_candidates")
            top_candidates = top_candidates if isinstance(top_candidates, list) else []
            missing_top_fields = sorted({
                field
                for candidate in top_candidates
                if isinstance(candidate, dict)
                for field in candidate_fields - set(candidate)
            })
            print(
                "ALPHA_DASHBOARD_READINESS "
                f"families={isinstance(alpha.get('families'), dict)} "
                f"candidate_counts={isinstance(alpha.get('candidate_counts'), dict)} "
                f"top_candidates={isinstance(alpha.get('top_candidates'), list)} "
                f"missing_top_fields={','.join(missing_top_fields) or 'NONE'} "
                f"has_flat_unstable_candidates="
                f"{isinstance(alpha.get('unstable_candidates'), list)}"
            )

            apps = json.loads(subprocess.check_output(["pm2", "jlist"]))
            wanted = {
                "aibot-monitor", "aibot-risk-manager",
                "aibot-dashboard", "wallet_feeder",
            }
            for app in apps:
                if app.get("name") not in wanted:
                    continue
                env = app.get("pm2_env", {})
                print(
                    "PM2_DELAYED_HEALTH "
                    f"name={app.get('name')} status={env.get('status')} "
                    f"pid={app.get('pid')} restarts={env.get('restart_time', 0)}"
                )
            PY

            upstream_status="$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' http://127.0.0.1:8501/ai-bot/)"
            test "$upstream_status" = "200"

            sudo bash ./scripts/configure_nginx_aibot.sh

            pm2 reset aibot-monitor
            pm2 reset aibot-risk-manager
            pm2 reset aibot-dashboard
            pm2 save
            pm2 status

            echo "Recent aibot-risk-manager logs:"
            pm2 logs aibot-risk-manager --lines 20 --nostream

            ./venv/bin/python - <<'PY'
            import json
            from pathlib import Path

            ledger_path = Path("data/paper_trades.json")
            ledger = (
                json.loads(ledger_path.read_text(encoding="utf-8"))
                if ledger_path.exists()
                else {"positions": {}}
            )
            unhealthy = []
            for mint, position in ledger.get("positions", {}).items():
                state = str(position.get("risk_state", "NORMAL"))
                failures = int(position.get("consecutive_quote_failures", 0) or 0)
                last_success = str(position.get("last_quote_success_at", ""))
                print(
                    "POSITION_HEALTH "
                    f"mint={mint[:8]}... state={state} "
                    f"failures={failures} last_success={last_success}"
                )
                if state in {"DEGRADED", "NO_ROUTE"}:
                    unhealthy.append(mint)
            if unhealthy:
                raise SystemExit(
                    f"unhealthy Jupiter quote state remains for {len(unhealthy)} position(s)"
                )
            print("JUPITER_POSITION_HEALTH=OK")
            PY

            printf '%s\n' "$DEPLOY_SHA" > .deployed-sha.tmp
            mv .deployed-sha.tmp .deployed-sha
            echo "DEPLOYED_SHA=$DEPLOY_SHA"
