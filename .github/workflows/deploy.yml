name: Deploy aibot

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/workflows/deploy.yml"
      - "scripts/deploy_contract.py"
      - "tests/test_deploy_contract.py"
      - "tests/test_deploy_workflows.py"
      - "tests/test_pm2_topology_check.py"
  workflow_dispatch:
    inputs:
      deploy_mode:
        description: Production deploy mode
        required: true
        type: choice
        default: normal
        options:
          - normal
          - diagnostic
      retention_enabled:
        description: Allow post-health retention in normal mode
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-aibot-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Ubuntu
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Resolve explicit deploy contract
        id: deploy_contract
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DEPLOY_MODE: ${{ inputs.deploy_mode }}
          INPUT_RETENTION_ENABLED: ${{ inputs.retention_enabled }}
        run: |
          set -Eeuo pipefail
          contract="$(
            git log -1 --format=%B | python scripts/deploy_contract.py \
              --event-name "$EVENT_NAME" \
              --input-mode "$INPUT_DEPLOY_MODE" \
              --input-retention-enabled "$INPUT_RETENTION_ENABLED"
          )"
          printf '%s\n' "$contract" >> "$GITHUB_OUTPUT"
          printf 'DEPLOY_CONTRACT %s automatic_rollback=false\n' \
            "$(tr '\n' ' ' <<<"$contract")"

      # No fingerprint input is supplied: appleboy connects without pinning the
      # server host key, as required for this password-only deployment.
      - name: Back up ledgers and prepare deploy ownership
        uses: appleboy/ssh-action@v1
        env:
          SUDO_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_MODE: ${{ steps.deploy_contract.outputs.deploy_mode }}
          RETENTION_ENABLED: ${{ steps.deploy_contract.outputs.retention_enabled }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: deploy
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          timeout: 30s
          command_timeout: 10m
          envs: SUDO_PASSWORD,DEPLOY_SHA,DEPLOY_MODE,RETENTION_ENABLED
          script: |
            set -Eeuo pipefail

            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' true

            python3 - <<'PY'
            import os
            from pathlib import Path

            data_root = Path("/var/www/aibot/data")
            names = (
                "signal_observations.json",
                "shadow_trades.json",
                "paper_trades.json",
                "wallet_performance.json",
                "global_metrics.json",
                "research_archive_metrics.json",
                "hypothesis_registry.json",
                "future_validation.json",
                "future_validation_manifest.json",
            )
            def allocated_bytes(path):
                metadata = path.stat()
                return max(metadata.st_size, metadata.st_blocks * 512)

            def require_safe_projection(used_bytes, available_bytes, expected_bytes):
                usable_bytes = used_bytes + available_bytes
                if usable_bytes <= 0:
                    raise SystemExit("root filesystem has no usable bytes")
                projected_used = used_bytes + expected_bytes
                projected_available = available_bytes - expected_bytes
                projected_percent = 100.0 * projected_used / usable_bytes
                if projected_percent >= 90.0:
                    raise SystemExit(
                        "projected root usage reaches the 90% safety gate"
                    )
                if projected_available < 512 * 1024 * 1024:
                    raise SystemExit(
                        "projected root headroom is below 512MiB"
                    )
                return projected_available, projected_percent

            expected_bytes = sum(
                allocated_bytes(path)
                for name in names
                if (path := data_root / name).is_file()
            )
            archive_root = data_root / "research_archive" / "records"
            if archive_root.is_dir():
                expected_bytes += sum(
                    allocated_bytes(path)
                    for path in archive_root.glob("*/*.json")
                    if path.is_file()
                )
            expected_bytes += 1024 * 1024

            disk = os.statvfs("/")
            used_bytes = (disk.f_blocks - disk.f_bfree) * disk.f_frsize
            available_bytes = disk.f_bavail * disk.f_frsize
            projected_available, projected_percent = require_safe_projection(
                used_bytes, available_bytes, expected_bytes
            )
            print(
                "PREDEPLOY_DISK_GATE "
                f"used_bytes={used_bytes} available_bytes={available_bytes} "
                f"expected_backup_bytes={expected_bytes} "
                f"projected_percent={projected_percent:.3f}"
            )
            PY

            if [[ "$DEPLOY_MODE" == "normal" ]] && sudo test -d /root/.pm2; then
              sudo env PM2_HOME=/root/.pm2 pm2 delete \
                aibot-monitor aibot-risk-manager aibot-dashboard wallet_feeder || true
              sudo env PM2_HOME=/root/.pm2 pm2 save --force || true
            fi

            sudo mkdir -p /var/www/aibot
            sudo chown deploy:deploy /var/www/aibot
            for static_path in src scripts venv; do
              if sudo test -e "/var/www/aibot/$static_path"; then
                sudo chown -R deploy:deploy "/var/www/aibot/$static_path"
              fi
            done
            for static_file in requirements.txt ecosystem.config.js .env; do
              if sudo test -e "/var/www/aibot/$static_file"; then
                sudo chown deploy:deploy "/var/www/aibot/$static_file"
              fi
            done
            for runtime_dir in data logs; do
              sudo mkdir -p "/var/www/aibot/$runtime_dir"
              sudo chown deploy:deploy "/var/www/aibot/$runtime_dir"
            done
            test -w /var/www/aibot

            backup_root="/home/deploy/aibot-backups"
            backup_dir="$backup_root/predeploy-$(date -u +%Y%m%dT%H%M%SZ)-${DEPLOY_SHA:0:12}"
            mkdir -p "$backup_dir"
            cd /var/www/aibot

            python3 - "$backup_dir" "$DEPLOY_SHA" <<'PY'
            import fcntl
            import hashlib
            import json
            import os
            import sys
            from datetime import datetime, timezone
            from pathlib import Path

            root = Path("/var/www/aibot/data")
            target = Path(sys.argv[1])
            deploy_sha = sys.argv[2]
            names = (
                "signal_observations.json",
                "shadow_trades.json",
                "paper_trades.json",
                "wallet_performance.json",
                "global_metrics.json",
                "research_archive_metrics.json",
                "hypothesis_registry.json",
                "future_validation.json",
                "future_validation_manifest.json",
            )

            def sized(value):
                return len(value) if isinstance(value, (dict, list)) else 0

            def summarize(name, document):
                if name == "signal_observations.json":
                    rows = document.get("observations")
                    if not isinstance(rows, list):
                        raise RuntimeError("observation rows are malformed")
                    identity = ""
                    if rows and isinstance(rows[-1], dict):
                        identity = str(
                            rows[-1].get("observation_id")
                            or rows[-1].get("id")
                            or ""
                        )
                    return {
                        "schema_version": document.get("schema_version"),
                        "version": document.get("version"),
                        "observation_count": len(rows),
                        "latest_observation_id_sha256": (
                            hashlib.sha256(identity.encode()).hexdigest()
                            if identity else None
                        ),
                    }
                if name == "shadow_trades.json":
                    return {"trade_count": sized(document.get("trades"))}
                if name == "paper_trades.json":
                    return {
                        "position_count": sized(document.get("positions")),
                        "event_count": sized(document.get("events")),
                    }
                if name == "global_metrics.json":
                    metrics = document.get("metrics")
                    if not isinstance(metrics, dict):
                        raise RuntimeError("global metrics are malformed")
                    return {
                        "metric_count": len(metrics),
                        "observer_state": metrics.get("observer_state"),
                        "pending_research_observations": metrics.get(
                            "pending_research_observations"
                        ),
                    }
                if name == "research_archive_metrics.json":
                    return {
                        "duplicate_prevented_count": document.get(
                            "duplicate_prevented_count"
                        ),
                        "archive_write_failure_count": document.get(
                            "archive_write_failure_count"
                        ),
                        "last_archive_success": document.get(
                            "last_archive_success"
                        ),
                    }
                if name == "hypothesis_registry.json":
                    return {
                        "schema_version": document.get("schema_version"),
                        "version": document.get("version"),
                        "registry_mode": document.get("registry_mode"),
                        "hypothesis_count": sized(document.get("hypotheses")),
                    }
                if name == "future_validation.json":
                    return {
                        "schema_version": document.get("schema_version"),
                        "hypothesis_count": sized(document.get("hypotheses")),
                    }
                if name == "future_validation_manifest.json":
                    return {
                        "schema_version": document.get("schema_version"),
                        "manifest_count": document.get("manifest_count"),
                        "manifest_digest": document.get("manifest_digest"),
                    }
                return {"wallet_count": sized(document.get("wallets"))}

            manifest = {
                "deploy_sha": deploy_sha,
                "created_at": datetime.now(timezone.utc).isoformat(),
                "created_at_epoch": datetime.now(timezone.utc).timestamp(),
                "files": {},
            }
            for name in names:
                source = root / name
                lock_path = source.with_name(f"{source.name}.lock")
                lock_path.parent.mkdir(parents=True, exist_ok=True)
                with lock_path.open("a+b") as lock:
                    fcntl.flock(lock.fileno(), fcntl.LOCK_EX)
                    try:
                        if not source.exists():
                            manifest["files"][name] = {"exists": False}
                            print(f"BACKUP_FILE name={name} exists=false")
                            continue
                        payload = source.read_bytes()
                        document = json.loads(payload.decode("utf-8"))
                        if not isinstance(document, dict):
                            raise RuntimeError(f"{name} is not a JSON object")
                        destination = target / name
                        with destination.open("xb") as output:
                            output.write(payload)
                            output.flush()
                            os.fsync(output.fileno())
                    finally:
                        fcntl.flock(lock.fileno(), fcntl.LOCK_UN)
                summary = summarize(name, document)
                manifest["files"][name] = {
                    "exists": True,
                    "sha256": hashlib.sha256(payload).hexdigest(),
                    "size_bytes": len(payload),
                    "summary": summary,
                }
                print(
                    f"BACKUP_FILE name={name} exists=true summary={summary}"
                )

            archive_source = root / "research_archive" / "records"
            archive_target = target / "research_archive" / "records"
            archive_files = sorted(archive_source.glob("*/*.json"))
            archive_digest = hashlib.sha256()
            archive_bytes = 0
            for source in archive_files:
                relative = source.relative_to(archive_source)
                payload = source.read_bytes()
                destination = archive_target / relative
                destination.parent.mkdir(parents=True, exist_ok=True)
                with destination.open("xb") as output:
                    output.write(payload)
                    output.flush()
                    os.fsync(output.fileno())
                digest = hashlib.sha256(payload).hexdigest()
                archive_digest.update(str(relative).encode("utf-8"))
                archive_digest.update(digest.encode("ascii"))
                archive_bytes += len(payload)
            manifest["research_archive"] = {
                "record_count": len(archive_files),
                "size_bytes": archive_bytes,
                "tree_sha256": archive_digest.hexdigest(),
            }
            print(
                "BACKUP_RESEARCH_ARCHIVE "
                f"records={len(archive_files)} size_bytes={archive_bytes} "
                f"tree_sha256={archive_digest.hexdigest()}"
            )

            provider_state_root = root / "solana_rpc_providers"
            manifest["rpc_provider_states"] = {}
            for provider in (
                "alchemy", "chainstack", "ankr", "helius", "solana_public"
            ):
                state_path = provider_state_root / f"{provider}.json"
                if not state_path.exists():
                    continue
                state = json.loads(state_path.read_text(encoding="utf-8"))
                if not isinstance(state, dict):
                    raise RuntimeError(f"RPC provider state malformed: {provider}")
                manifest["rpc_provider_states"][provider] = {
                    key: state.get(key)
                    for key in (
                        "request_count", "success_count", "failure_count",
                        "rate_limit_count", "circuit_open_count", "circuit_state",
                    )
                }

            manifest_path = target / "manifest.json"
            temporary = target / "manifest.json.tmp"
            with temporary.open("x", encoding="utf-8") as output:
                json.dump(manifest, output, ensure_ascii=False, indent=2)
                output.write("\n")
                output.flush()
                os.fsync(output.fileno())
            os.replace(temporary, manifest_path)
            print(f"BACKUP_MANIFEST={manifest_path}")
            PY

            printf '%s\n' "$backup_dir" > "$backup_root/latest-${DEPLOY_SHA}.txt"

      - name: Upload application source
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: deploy
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          timeout: 30s
          command_timeout: 5m
          source: "src,requirements.txt,ecosystem.config.js,scripts"
          target: "/var/www/aibot"
          overwrite: true
          rm: false

      - name: Install, validate, and reload PM2 services
        uses: appleboy/ssh-action@v1
        env:
          SUDO_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_MODE: ${{ steps.deploy_contract.outputs.deploy_mode }}
          RETENTION_ENABLED: ${{ steps.deploy_contract.outputs.retention_enabled }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: deploy
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          timeout: 30s
          command_timeout: 20m
          envs: SUDO_PASSWORD,DEPLOY_SHA,DEPLOY_MODE,RETENTION_ENABLED
          script: |
            set -Eeuo pipefail

            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' true
            sudo chown deploy:deploy /var/www/aibot
            for static_path in src scripts venv; do
              if sudo test -e "/var/www/aibot/$static_path"; then
                sudo chown -R deploy:deploy "/var/www/aibot/$static_path"
              fi
            done
            for static_file in requirements.txt ecosystem.config.js .env; do
              if sudo test -e "/var/www/aibot/$static_file"; then
                sudo chown deploy:deploy "/var/www/aibot/$static_file"
              fi
            done
            for runtime_dir in data logs; do
              sudo mkdir -p "/var/www/aibot/$runtime_dir"
              sudo chown deploy:deploy "/var/www/aibot/$runtime_dir"
            done

            cd /var/www/aibot

            mkdir -p data logs

            last_successful_sha="MISSING"
            if [[ -f .deployed-sha ]]; then
              last_successful_sha="$(tr -d '[:space:]' < .deployed-sha)"
            fi
            echo "ACTIVE_SOURCE_SHA=$DEPLOY_SHA"
            echo "LAST_SUCCESSFUL_DEPLOY_SHA=$last_successful_sha"
            echo "NO_AUTOMATIC_ROLLBACK=true"

            if [[ ! -x ./venv/bin/python ]]; then
              if [[ "$DEPLOY_MODE" == "diagnostic" ]]; then
                echo "diagnostic deploy requires the existing production venv" >&2
                exit 1
              fi
              echo "Existing venv not found; creating /var/www/aibot/venv"
              python3 -m venv venv
            fi

            if [[ ! -f ./.env ]]; then
              echo "ERROR: /var/www/aibot/.env is missing; deployment cannot start safely." >&2
              exit 1
            fi

            if [[ "$DEPLOY_MODE" == "normal" ]]; then
              PIP_NO_CACHE_DIR=1 ./venv/bin/python -m pip install \
                --disable-pip-version-check \
                --only-binary=:all: \
                -r requirements.txt
            else
              echo "DIAGNOSTIC_SKIP maintenance=dependency_install"
            fi

            ./venv/bin/python -m compileall -q src
            ./venv/bin/python -c \
              "import fcntl; from src.state_store import exclusive_file_lock; print('fcntl/state_store: OK')"
            export PM2_HOME=/home/deploy/.pm2
            ./venv/bin/python scripts/pm2_topology_check.py --phase preflight
            if [[ "$DEPLOY_MODE" == "normal" ]]; then
              ./venv/bin/python -m src.research_archive
            else
              echo "DIAGNOSTIC_SKIP maintenance=research_archive"
            fi

            pm2 startOrReload ecosystem.config.js --update-env

            pm2 describe aibot-monitor >/dev/null
            pm2 describe aibot-risk-manager >/dev/null
            pm2 describe aibot-dashboard >/dev/null
            pm2 describe wallet_feeder >/dev/null

            ownership_mismatch="$(find src scripts venv -xdev \
              -path '*/__pycache__' -prune -o \
              \( ! -user deploy -o ! -group deploy \) -print -quit)"
            if [[ -n "$ownership_mismatch" ]]; then
              echo "ERROR: static ownership mismatch remains at $ownership_mismatch" >&2
              exit 1
            fi
            for owned_path in \
              /var/www/aibot \
              /var/www/aibot/requirements.txt \
              /var/www/aibot/ecosystem.config.js \
              /var/www/aibot/.env \
              /var/www/aibot/data \
              /var/www/aibot/logs; do
              ownership="$(stat -c '%U:%G' -- "$owned_path")"
              if [[ "$ownership" != "deploy:deploy" ]]; then
                echo "ERROR: ownership mismatch remains at $owned_path ($ownership)" >&2
                exit 1
              fi
            done

            pm2_snapshot() {
              ./venv/bin/python - <<'PY'
            import json
            import subprocess

            apps = json.loads(subprocess.check_output(["pm2", "jlist"]))
            selected = {}
            for app in apps:
                name = app.get("name")
                if name in {
                    "aibot-monitor",
                    "aibot-risk-manager",
                    "aibot-dashboard",
                    "wallet_feeder",
                }:
                    env = app.get("pm2_env", {})
                    selected[name] = {
                        "status": env.get("status"),
                        "pid": app.get("pid"),
                        "restart_time": env.get("restart_time", 0),
                    }
            print(json.dumps(selected, sort_keys=True, separators=(",", ":")))
            PY
            }

            sleep 20
            pm2_before="$(pm2_snapshot)"
            sleep 10
            pm2_after="$(pm2_snapshot)"

            ./venv/bin/python scripts/pm2_topology_check.py --phase poststart
            ./venv/bin/python - "$pm2_before" "$pm2_after" <<'PY'
            import json
            import sys

            before = json.loads(sys.argv[1])
            after = json.loads(sys.argv[2])
            core = (
                "aibot-monitor",
                "aibot-risk-manager",
                "aibot-dashboard",
            )
            for name in core:
                if name not in before or name not in after:
                    raise SystemExit(f"PM2 process missing: {name}")
                if after[name]["status"] != "online" or not after[name]["pid"]:
                    raise SystemExit(f"PM2 process unhealthy: {name}")
                if after[name]["restart_time"] != before[name]["restart_time"]:
                    raise SystemExit(f"PM2 restart loop detected: {name}")
                print(
                    "PM2_HEALTH "
                    f"name={name} status=online pid={after[name]['pid']} "
                    f"restarts={after[name]['restart_time']}"
                )
            feeder = after.get("wallet_feeder", {})
            if feeder.get("status") not in {"online", "stopped"}:
                raise SystemExit("wallet_feeder PM2 entry is unhealthy")
            print(
                "PM2_FEEDER "
                f"status={feeder.get('status')} pid={feeder.get('pid')} "
                f"restarts={feeder.get('restart_time')}"
            )
            PY

            verification_failed=0
            for app in aibot-monitor aibot-risk-manager aibot-dashboard; do
              pid="$(pm2 pid "$app")"
              owner="$(ps -o user= -p "$pid" 2>/dev/null | xargs || true)"
              if [[ -z "$pid" || "$pid" == "0" || "$owner" != "deploy" ]]; then
                echo "ERROR: $app failed verification (pid=$pid owner=$owner)" >&2
                pm2 logs "$app" --lines 30 --nostream || true
                verification_failed=1
              fi
            done

            test "$verification_failed" -eq 0

            ./venv/bin/python - "$DEPLOY_SHA" "$DEPLOY_MODE" <<'PY'
            import fcntl
            import hashlib
            import json
            import os
            import tempfile
            import time
            import sys
            from pathlib import Path

            from scripts.observer_health_gate import (
                ObserverHealthGateError,
                wait_for_observer_health,
            )

            deploy_sha = sys.argv[1]
            deploy_mode = sys.argv[2]
            backup_root = Path("/home/deploy/aibot-backups")
            marker = backup_root / f"latest-{deploy_sha}.txt"
            backup_dir = Path(marker.read_text(encoding="utf-8").strip())
            manifest = json.loads(
                (backup_dir / "manifest.json").read_text(encoding="utf-8")
            )
            if manifest.get("deploy_sha") != deploy_sha:
                raise SystemExit("backup manifest deploy SHA mismatch")
            for name, item in manifest["files"].items():
                if not item.get("exists"):
                    continue
                payload = (backup_dir / name).read_bytes()
                if hashlib.sha256(payload).hexdigest() != item["sha256"]:
                    raise SystemExit(f"backup checksum mismatch: {name}")
            archive_digest = hashlib.sha256()
            archive_files = sorted(
                (backup_dir / "research_archive" / "records").glob("*/*.json")
            )
            archive_bytes = 0
            for path in archive_files:
                payload = path.read_bytes()
                relative = path.relative_to(
                    backup_dir / "research_archive" / "records"
                )
                archive_digest.update(str(relative).encode("utf-8"))
                archive_digest.update(hashlib.sha256(payload).hexdigest().encode("ascii"))
                archive_bytes += len(payload)
            archive_manifest = manifest.get("research_archive", {})
            if (
                len(archive_files) != archive_manifest.get("record_count")
                or archive_bytes != archive_manifest.get("size_bytes")
                or archive_digest.hexdigest() != archive_manifest.get("tree_sha256")
            ):
                raise SystemExit("research archive backup checksum mismatch")

            data = Path("data")
            current = {}
            for name in (
                "signal_observations.json",
                "shadow_trades.json",
                "paper_trades.json",
                "wallet_performance.json",
            ):
                document = json.loads((data / name).read_text(encoding="utf-8"))
                if not isinstance(document, dict):
                    raise SystemExit(f"production ledger malformed: {name}")
                current[name] = document

            if deploy_mode == "normal":
                for name in (
                    "hypothesis_registry.json",
                    "future_validation.json",
                    "future_validation_manifest.json",
                ):
                    backup_item = manifest["files"].get(name, {})
                    if not backup_item.get("exists"):
                        continue
                    live_path = data / name
                    lock_path = live_path.with_name(f"{live_path.name}.lock")
                    with lock_path.open("a+b") as lock:
                        fcntl.flock(lock.fileno(), fcntl.LOCK_EX)
                        try:
                            if not live_path.exists():
                                payload = (backup_dir / name).read_bytes()
                                with tempfile.NamedTemporaryFile(
                                    "wb", dir=live_path.parent, delete=False
                                ) as output:
                                    temporary = Path(output.name)
                                    output.write(payload)
                                    output.flush()
                                    os.fsync(output.fileno())
                                os.replace(temporary, live_path)
                            document = json.loads(
                                live_path.read_text(encoding="utf-8")
                            )
                            if not isinstance(document, dict):
                                raise SystemExit(
                                    f"research state malformed: {name}"
                                )
                        finally:
                            fcntl.flock(lock.fileno(), fcntl.LOCK_UN)
                    print(f"RESEARCH_STATE_RESTORED name={name}")
            else:
                print("DIAGNOSTIC_SKIP maintenance=research_state_restore")

            observations = current["signal_observations.json"]
            if observations.get("schema_version") != 5:
                raise SystemExit("signal observation schema v5 migration failed")
            rows = observations.get("observations")
            if not isinstance(rows, list):
                raise SystemExit("signal observation rows are malformed")
            before_observation = manifest["files"][
                "signal_observations.json"
            ]
            previous_count = (
                before_observation.get("summary", {}).get("observation_count", 0)
                if before_observation.get("exists") else 0
            )
            if len(rows) < previous_count:
                raise SystemExit("signal observation count decreased during deploy")

            def read_observer_metrics():
                metrics_document = json.loads(
                    (data / "global_metrics.json").read_text(encoding="utf-8")
                )
                return metrics_document.get("metrics", {})

            try:
                metrics = wait_for_observer_health(read_observer_metrics)
            except ObserverHealthGateError as exc:
                raise SystemExit(str(exc)) from exc
            heartbeat = metrics["observer_heartbeat_at"]

            latest_identity = ""
            if rows and isinstance(rows[-1], dict):
                latest_identity = str(
                    rows[-1].get("observation_id")
                    or rows[-1].get("id")
                    or ""
                )
            latest_hash = (
                hashlib.sha256(latest_identity.encode()).hexdigest()
                if latest_identity else None
            )
            previous_hash = before_observation.get("summary", {}).get(
                "latest_observation_id_sha256"
            )
            shadow_count = len(current["shadow_trades.json"].get("trades", []))
            positions = current["paper_trades.json"].get("positions", {})
            wallets = current["wallet_performance.json"].get("wallets", {})
            print(
                "OBSERVER_HEALTH "
                f"state=RUNNING heartbeat_age_seconds={time.time() - heartbeat:.1f} "
                f"pending={metrics.get('pending_research_observations')} "
                f"last_success={metrics.get('last_successful_horizon_sample_at')} "
                f"horizon_missed={metrics.get('horizon_missed_count')}"
            )
            print(
                "LEDGER_HEALTH schema=5 "
                f"observations_before={previous_count} observations_after={len(rows)} "
                f"latest_id_changed={latest_hash != previous_hash} "
                f"shadow_trades={shadow_count} positions={len(positions)} "
                f"wallets={len(wallets)} backup={backup_dir}"
            )
            PY

            ./venv/bin/python - <<'PY'
            from src.solana_rpc import provider_configs_from_env

            providers = provider_configs_from_env()
            names = ",".join(provider.name for provider in providers)
            if not providers:
                raise SystemExit("no Solana RPC provider is configured")
            print(f"RPC_CONFIG providers={names}")
            PY

            if [[ "$DEPLOY_MODE" == "normal" ]]; then
              ./venv/bin/python -m src.research.future_validation \
                --registry-mode prospective-five
              ./venv/bin/python - <<'PY'
            import json
            from collections import Counter
            from pathlib import Path

            from src.research.future_validation import (
                validate_boundary_manifest,
                validate_registry,
            )

            registry = json.loads(
                Path("data/hypothesis_registry.json").read_text(encoding="utf-8")
            )
            report = json.loads(
                Path("data/future_validation.json").read_text(encoding="utf-8")
            )
            manifest = json.loads(
                Path("data/future_validation_manifest.json").read_text(
                    encoding="utf-8"
                )
            )
            validate_registry(registry)
            validate_boundary_manifest(registry, manifest)
            hypotheses = registry.get("hypotheses", [])
            if (
                registry.get("registry_mode") != "prospective-five"
                or len(hypotheses) != 5
                or any(
                    item.get("family") != "MOMENTUM"
                    or item.get("discovery_source")
                    != "prospective_pre_registered_v1"
                    for item in hypotheses
                )
            ):
                raise SystemExit("prospective H1-H5 registry contract failed")
            if (
                report.get("registry_mode") != "prospective-five"
                or report.get("hypothesis_count") != 5
                or report.get("discovery_boundary") != manifest
            ):
                raise SystemExit("future validation report provenance failed")
            statuses = Counter(
                str(item.get("status") or "UNKNOWN") for item in hypotheses
            )
            print(
                "FUTURE_H1_H5 "
                f"count={len(hypotheses)} "
                f"mode={registry.get('registry_mode')} "
                f"cutoff={manifest.get('discovery_data_end')} "
                f"manifest_count={manifest.get('manifest_count')} "
                f"manifest_digest={manifest.get('manifest_digest')} "
                f"statuses={dict(sorted(statuses.items()))}"
            )
            PY
            else
              echo "DIAGNOSTIC_SKIP maintenance=future_validation"
            fi

            ./venv/bin/python - <<'PY'
            import json
            from collections import Counter
            from pathlib import Path

            paper = json.loads(
                Path("data/paper_trades.json").read_text(encoding="utf-8")
            )
            events = paper.get("events")
            if not isinstance(events, list):
                raise SystemExit("paper ledger events are malformed")
            sequences = [
                int(item["event_seq"]) for item in events
                if isinstance(item, dict) and item.get("event_seq") is not None
            ]
            if sequences != sorted(sequences) or len(sequences) != len(set(sequences)):
                raise SystemExit("paper ledger event sequence is invalid")
            event_types = Counter(
                str(item.get("type") or "UNKNOWN") for item in events
                if isinstance(item, dict)
            )
            print(
                "PAPER_LEDGER "
                f"buys={event_types['BUY']} sells={event_types['SELL']} "
                f"positions={len(paper.get('positions', {}))} "
                f"next_event_seq={paper.get('next_event_seq')}"
            )
            PY
            upstream_status="$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' http://127.0.0.1:8501/ai-bot/)"
            test "$upstream_status" = "200"

            if [[ "$DEPLOY_MODE" == "normal" ]]; then
              printf '%s\n' "$SUDO_PASSWORD" | \
                sudo -S -p '' bash ./scripts/configure_nginx_aibot.sh
              pm2 reset aibot-monitor
              pm2 reset aibot-risk-manager
              pm2 reset aibot-dashboard
              pm2 save
            else
              echo "DIAGNOSTIC_SKIP maintenance=nginx_reconfigure"
              echo "DIAGNOSTIC_SKIP maintenance=pm2_reset"
              echo "DIAGNOSTIC_SKIP maintenance=pm2_save"
            fi
            pm2 status

            echo "Recent aibot-risk-manager logs:"
            pm2 logs aibot-risk-manager --lines 20 --nostream

            ./venv/bin/python - <<'PY'
            import json
            from pathlib import Path

            ledger_path = Path("data/paper_trades.json")
            ledger = (
                json.loads(ledger_path.read_text(encoding="utf-8"))
                if ledger_path.exists()
                else {"positions": {}}
            )
            unhealthy = []
            for mint, position in ledger.get("positions", {}).items():
                state = str(position.get("risk_state", "NORMAL"))
                failures = int(position.get("consecutive_quote_failures", 0) or 0)
                last_success = str(position.get("last_quote_success_at", ""))
                print(
                    "POSITION_HEALTH "
                    f"mint={mint[:8]}... state={state} "
                    f"failures={failures} last_success={last_success}"
                )
                if state in {"DEGRADED", "NO_ROUTE"}:
                    unhealthy.append(mint)
            if unhealthy:
                raise SystemExit(
                    f"unhealthy Jupiter quote state remains for {len(unhealthy)} position(s)"
                )
            print("JUPITER_POSITION_HEALTH=OK")
            PY

            if [[ "$DEPLOY_MODE" == "normal" && \
                  "$RETENTION_ENABLED" == "true" ]]; then
              ./venv/bin/python scripts/storage_retention.py \
                --data-root data \
                --legacy-temp-min-age-seconds 600 \
                --backup-root /home/deploy/aibot-backups \
                --keep-backups 3
            else
              echo "RETENTION_SKIPPED mode=$DEPLOY_MODE enabled=$RETENTION_ENABLED"
            fi
            ./venv/bin/python scripts/deploy_contract.py \
              --success-marker .deployed-sha \
              --deploy-sha "$DEPLOY_SHA"
            echo "DEPLOYED_SHA=$DEPLOY_SHA"
